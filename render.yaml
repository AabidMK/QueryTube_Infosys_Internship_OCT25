services:
  - type: web
    name: querytube-backend
    env: python
    rootDirectory: api # Assuming your code is in an "api" folder
    buildCommand: |
      echo "🚀 Installing Python dependencies..."
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      echo "🚀 Starting QueryTube Backend..."
      echo "🔗 Hugging Face Repository: karunya-3/faiss-video-db"
      echo "📂 Cache directory: $(pwd)/faiss_cache"
      gunicorn main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: GEMINI_API_KEY
        sync: false  
    autoDeploy: true